# ==============================================================================
# ShoeMatch AI — Hostinger shared hosting (Apache / LiteSpeed)
# ==============================================================================

# ---- Force HTTPS -------------------------------------------------------------
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !https
RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

# ---- Default document --------------------------------------------------------
DirectoryIndex index.html

# ---- Friendly routes ---------------------------------------------------------
# /app  -> the main studio UI      /mobile -> the phone UI
RewriteRule ^app/?$   /app.html          [L]
RewriteRule ^mobile/?$ /mobile/index.html [L]

# ---- Correct MIME types ------------------------------------------------------
<IfModule mod_mime.c>
  AddType text/javascript            .js
  AddType text/css                   .css
  AddType image/svg+xml              .svg
  AddType application/json           .json
</IfModule>

# ---- Compression -------------------------------------------------------------
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/javascript
  AddOutputFilterByType DEFLATE application/javascript application/json
  AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# ---- Caching -----------------------------------------------------------------
# Assets are versioned via ?v= query strings, so they can cache hard.
# HTML must NOT cache, or users get a stale shell pointing at old assets.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css              "access plus 1 year"
  ExpiresByType text/javascript       "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType image/png             "access plus 1 year"
  ExpiresByType image/jpeg            "access plus 1 year"
  ExpiresByType image/svg+xml         "access plus 1 year"
  ExpiresByType text/html             "access plus 0 seconds"
</IfModule>

<FilesMatch "\.(html)$">
  <IfModule mod_headers.c>
    Header set Cache-Control "no-cache, must-revalidate"
  </IfModule>
</FilesMatch>

# config.js decides which backend the UI talks to — never let it go stale.
<Files "config.js">
  <IfModule mod_headers.c>
    Header set Cache-Control "no-cache, must-revalidate"
  </IfModule>
</Files>

# ---- Baseline security headers ----------------------------------------------
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ---- Block dotfiles ----------------------------------------------------------
<FilesMatch "^\.">
  Require all denied
</FilesMatch>
