[package]
name = "shoematch-ai"
version = "1.0.0"
description = "ShoeMatch AI — Native Visual Search & Catalog Matching Desktop Client"
authors = ["ShoeMatch AI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
